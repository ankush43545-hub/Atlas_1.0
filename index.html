<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas Chat</title>

<style>
    /* ===== GLOBAL ===== */
    body {
        margin: 0;
        background: #0b0c10;
        font-family: "Inter", Arial, sans-serif;
        color: #f0f0f0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    /* ===== HEADER ===== */
    header {
        text-align: center;
        padding: 18px 0;
        font-size: 1.4rem;
        font-weight: 600;
        background: rgba(20, 20, 22, 0.7);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        letter-spacing: 2px;
    }

    /* ===== CHAT AREA ===== */
    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        scroll-behavior: smooth;
    }

    /* Scrollbar */
    #chat::-webkit-scrollbar {
        width: 6px;
    }
    #chat::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 3px;
    }

    /* ===== CHAT BUBBLES ===== */
    .msg {
        max-width: 80%;
        padding: 14px 18px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.4rem;
        animation: fadeInUp 0.25s ease;
        backdrop-filter: blur(4px);
    }

    .user {
        align-self: flex-end;
        background: rgba(0, 150, 255, 0.15);
        border: 1px solid rgba(0, 150, 255, 0.25);
        box-shadow: 0 0 8px rgba(0,150,255,0.25);
    }

    .bot {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.07);
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ===== INPUT AREA ===== */
    footer {
        padding: 12px 14px;
        display: flex;
        gap: 12px;
        background: rgba(18, 19, 24, 0.7);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    #input {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        border: none;
        outline: none;
        background: rgba(40, 40, 45, 0.6);
        color: #fff;
        font-size: 1rem;
        box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
        transition: 0.2s ease;
        backdrop-filter: blur(6px);
    }

    #input:focus {
        background: rgba(55, 55, 60, 0.7);
    }

    /* ===== SEND BUTTON ===== */
    #sendBtn {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: none;
        background: #009dff;
        box-shadow: 0 0 15px #009dffaa;
        color: #fff;
        font-size: 1.4rem;
        cursor: pointer;
        transition: 0.18s ease;
    }

    #sendBtn:active {
        transform: scale(0.9);
        box-shadow: 0 0 6px #009dff;
    }

    /* ===== TYPING ANIMATION ===== */
    .typing {
        display: flex;
        gap: 6px;
        padding: 12px 16px;
        background: rgba(255,255,255,0.05);
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.07);
        width: fit-content;
        margin-top: -5px;
        backdrop-filter: blur(5px);
        animation: fadeInUp 0.2s ease;
    }

    .typing span {
        width: 10px;
        height: 10px;
        background: #ccc;
        border-radius: 50%;
        animation: bounce 1.4s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
        0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-5px); }
    }
</style>
</head>

<body>

<header>ATLAS</header>

<div id="chat"></div>

<footer>
    <input id="input" placeholder="Message Atlas..." />
    <button id="sendBtn">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.className = "msg " + sender;
    msg.textContent = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "typing bot";
    wrap.id = "typing";
    wrap.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
}

async function sendMessage() {
    let text = input.value.trim();
    if (!text) return;

    // Show user message
    addMessage(text, "user");
    input.value = "";

    // Typing dots show
    showTyping();

    try {
        const res = await fetch("https://atlas-backend-roi5.onrender.com/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        removeTyping();
        addMessage(data.reply || "Atlas did not respond.", "bot");

    } catch (e) {
        removeTyping();
        addMessage("⚠ Network error. Backend unreachable.", "bot");
    }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
